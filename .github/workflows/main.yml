name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 2 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'Configure the RDP_PASSWORD repository secret first.'
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser -Name 'RDP' `
              -Password $securePass `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePass
          }

          foreach ($group in @('Administrators', 'Remote Desktop Users')) {
            $members = Get-LocalGroupMember -Group $group |
              Select-Object -ExpandProperty Name

            if ($members -notcontains "$env:COMPUTERNAME\RDP") {
              Add-LocalGroupMember -Group $group -Member 'RDP'
            }
          }

          if (-not (Get-LocalUser -Name 'RDP')) {
            throw 'RDP user creation failed.'
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:TEMP 'tailscale.msi'
          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'

          try {
            Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

            $process = Start-Process -FilePath 'msiexec.exe' `
              -ArgumentList @('/i', "`"$installerPath`"", '/quiet', '/norestart') `
              -Wait -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed: $($process.ExitCode)"
            }
          }
          finally {
            Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          }

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw 'Configure the TAILSCALE_AUTHKEY repository secret.'
          }

          $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path $tsExe)) {
            throw 'Tailscale executable not found.'
          }

          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale connection failed.'
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $result = & $tsExe ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $result) {
              $candidate = "$($result | Select-Object -First 1)".Trim()

              if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $tsIP = $candidate
                break
              }
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw 'Tailscale IP was not assigned.'
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            throw 'TCP connection to RDP port 3389 failed.'
          }

          Write-Host 'TCP connectivity successful.'

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host 'Username: RDP'
          Write-Host 'Use your configured RDP_PASSWORD secret.'

          while ($true) {
            Write-Host "[$(Get-Date)] Runner active."
            Start-Sleep -Seconds 300
          }
